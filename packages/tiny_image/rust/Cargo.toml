[package]
name = "tiny_image"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.7.0"
# ico = "0.4.0"
image = "0.25.5"
imagequant = "4.3.3"
# libwebp-sys2 = "0.1.10"
lodepng = "3.10.7"
# mozjpeg = "0.10.12"
# mozjpeg-sys = "2.2.2"
png = "0.17.16"
webp = "0.3.0"
# windows = "0.59.0"
# windows = { version = "0.39.0", features = [
# 
#     "Win32_UI_WindowsAndMessaging",
#     "Win32_Foundation",
#     "Win32_System_Com",
#     "Win32_System_Ole",
#     "Win32_UI_Shell",
#     "Win32_UI_Shell_Common",
